name: CI
on:
  push:
    branches: [master, test-github-ci]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: board-game
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-root
          MYSQL_DATABASE: cotuong_ci
          MYSQL_USER: cotuong_ci
          MYSQL_PASSWORD: ci-disposable-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: board-game/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests intentionally run without production DB configuration.
      - run: npm test
      - name: Disposable MySQL integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: cotuong_ci
          DB_USER: cotuong_ci
          DB_PASSWORD: ci-disposable-password
          DB_INTEGRATION: '1'
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:verify
          npm run db:smoke
          npm test -- tests/account-persistence.integration.test.ts tests/admin.integration.test.ts tests/shop.integration.test.ts tests/test-bot.integration.test.ts --maxWorkers=1
      - run: npm run build
      - name: Check deployment scripts
        run: bash -n scripts/deploy-vps.sh
      - name: Backup adapter regression (no database or systemd)
        run: python3 -m unittest discover -s tests/backup_adapter -v
      - name: Deploy-user regression (disposable paths, mocked service and sudo)
        run: python3 -m unittest discover -s tests/deploy_user -v
      - name: New VPS helper regression
        run: |
          bash -n ops/vps-new/*.sh ops/vps-new/cotuong-vps-admin ops/vps-new/cotuong-deploy-activate ops/vps-new/cotuong-local-backup
          python3 -m py_compile ops/vps-new/verify-test-release.py ops/vps-new/validate-test-backup.py
          bash ops/vps-new/test-node-tree-check.sh
      - name: Release artifact contract regression
        run: python3 -m unittest discover -s tests/release_artifact -v
      - name: VPS activation rollback regression (isolated temp paths and mocked host/service)
        run: sudo -n python3 -m unittest discover -s tests/vps_new -v

  powershell-5-1-runner:
    name: PowerShell 5.1 backup runner regression
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse and test read-only preflight construction
        shell: powershell
        run: .\board-game\tests\vps_new\test-backup-restore-runner.ps1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
