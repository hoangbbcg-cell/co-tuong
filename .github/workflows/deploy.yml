name: HOVANG production - prepare VPS release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character master SHA with successful CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cotuong-production
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: production

    steps:
      - name: Checkout master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify requested commit and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.commit }}
        run: |
          set -Eeuo pipefail

          [[ "$TARGET" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "${TARGET}^{commit}"
          git merge-base --is-ancestor "$TARGET" origin/master

          runs_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET}&branch=master&event=push&status=completed&per_page=100")"

          jq -e --arg sha "$TARGET" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "master" and
              .event == "push" and
              .conclusion == "success"
            )] | length > 0
          ' <<< "$runs_json" >/dev/null

          git checkout --detach "$TARGET"
          test "$(git rev-parse HEAD)" = "$TARGET"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: board-game/package-lock.json

      - name: Build and test immutable VPS release
        working-directory: board-game
        env:
          RELEASE_SHA: ${{ inputs.commit }}
        run: |
          set -Eeuo pipefail
          bash ./ops/vps-new/build-test-release.sh "$RELEASE_SHA"

      - name: Save release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hovang-vps-release-${{ inputs.commit }}
          path: board-game/${{ inputs.commit }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      # IMPORTANT:
      # Preparation only. There is deliberately no SSH, SCP,
      # MySQL migration, systemctl restart or release activation.
      # Production activation must be added after the backup
      # and database compatibility gates have been verified
      # for VPS 103.153.254.184.
