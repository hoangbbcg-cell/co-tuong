name: VPS test read-only preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  validate-environment-gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the reviewed vps-test gate before referencing the Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/vps-test")"
          jq -e '
            .can_admins_bypass == false and
            .deployment_branch_policy.custom_branch_policies == true and
            .deployment_branch_policy.protected_branches == false and
            any(.protection_rules[]?; .type == "required_reviewers" and
              any(.reviewers[]?; .reviewer.login == "hoangbbcg-cell"))
          ' <<< "$environment_json" >/dev/null || {
            echo 'vps-test must require hoangbbcg-cell, restrict to custom branches, and disallow admin bypass.' >&2
            exit 1
          }
          branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/vps-test/deployment-branch-policies")"
          jq -e '[.branch_policies[].name] == ["master"]' <<< "$branch_json" >/dev/null || {
            echo 'vps-test must allow only the master branch.' >&2
            exit 1
          }

  preflight:
    if: github.ref == 'refs/heads/master'
    needs: validate-environment-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vps-test
    steps:
      - name: Check deploy contract without changing the VPS
        env:
          VPS_TEST_SSH_KEY: ${{ secrets.VPS_TEST_SSH_KEY }}
          VPS_TEST_KNOWN_HOSTS: ${{ secrets.VPS_TEST_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_TEST_SSH_KEY" && -n "$VPS_TEST_KNOWN_HOSTS" ]] || {
            echo 'Configure VPS_TEST_SSH_KEY and VPS_TEST_KNOWN_HOSTS in the vps-test Environment.' >&2
            exit 1
          }
          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/cotuong-vps-test-preflight.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_TEST_SSH_KEY" > "$ssh_dir/cotuong_deploy"
          printf '%s\n' "$VPS_TEST_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/cotuong_deploy" "$ssh_dir/known_hosts"
          ssh-keygen -F 103.153.254.184 -f "$ssh_dir/known_hosts" >/dev/null || {
            echo 'Known-hosts secret does not contain the pinned new VPS host.' >&2
            exit 1
          }
          ssh-keygen -F 103.153.254.184 -f "$ssh_dir/known_hosts" | ssh-keygen -lf - |
            grep -F 'SHA256:CJzV7hFpB6mDfGDoBm/ViJvw5D5HlBhR60gmOJGLW74' |
            grep -F '(ED25519)' >/dev/null || {
              echo 'Known-hosts secret does not match the pinned ED25519 fingerprint.' >&2
              exit 1
            }

          ssh_opts=(
            -i "$ssh_dir/cotuong_deploy"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
          )
          ssh "${ssh_opts[@]}" cotuong_deploy@103.153.254.184 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == cotuong_deploy && "$HOME" == /home/cotuong_deploy ]]
          ip -o -4 addr show scope global | awk '{sub(/\/.*/, "", $4); print $4}' | grep -Fxq 103.153.254.184
          [[ -d /srv/cotuong && ! -L /srv/cotuong ]]
          [[ "$(stat -c %U:%G:%a /srv/cotuong)" == root:root:755 ]]
          [[ -d /srv/cotuong/releases && ! -L /srv/cotuong/releases ]]
          [[ "$(stat -c %U:%G:%a /srv/cotuong/releases)" == cotuong_deploy:cotuong_release:2750 ]]
          [[ -d /srv/cotuong/deploy && ! -L /srv/cotuong/deploy ]]
          [[ "$(stat -c %U:%G:%a /srv/cotuong/deploy)" == cotuong_deploy:cotuong_deploy:700 ]]
          [[ -d /home/cotuong_deploy/.cotuong-incoming && ! -L /home/cotuong_deploy/.cotuong-incoming ]]
          [[ "$(stat -c %U:%G:%a /home/cotuong_deploy/.cotuong-incoming)" == cotuong_deploy:cotuong_deploy:700 ]]
          if [[ -r /etc/cotuong/cotuong.env ]]; then
            echo 'Deployment identity can read the protected environment file.' >&2
            exit 1
          fi
          systemctl is-enabled --quiet cotuong-test.service
          unit="$(systemctl cat cotuong-test.service)"
          grep -Fxq 'User=cotuong' <<< "$unit"
          grep -Fxq 'Group=cotuong' <<< "$unit"
          grep -Fxq 'WorkingDirectory=/srv/cotuong/current' <<< "$unit"
          grep -Fxq 'EnvironmentFile=/etc/cotuong/cotuong.env' <<< "$unit"
          grep -Fxq 'Environment=HOST=127.0.0.1' <<< "$unit"
          grep -Fxq 'Environment=PORT=3001' <<< "$unit"
          grep -Fxq 'Environment=NODE_ENV=production' <<< "$unit"
          grep -Fxq 'ExecStart=/opt/node-v22.23.3/bin/node --import tsx server/index.ts' <<< "$unit"
          grep -Fxq 'ProtectHome=true' <<< "$unit"
          grep -Fxq 'ProtectSystem=strict' <<< "$unit"
          grep -Fxq 'ReadWritePaths=/srv/cotuong/shared' <<< "$unit"
          id -nG | tr ' ' '\n' | grep -Fxq cotuong_release
          id -nG cotuong | tr ' ' '\n' | grep -Fxq cotuong_release
          [[ -f /usr/local/sbin/cotuong-deploy-activate && ! -L /usr/local/sbin/cotuong-deploy-activate ]]
          [[ "$(stat -c %U:%G:%a /usr/local/sbin/cotuong-deploy-activate)" == root:root:750 ]]
          test -x /usr/local/sbin/cotuong-deploy-activate
          sudo -n -l /usr/local/sbin/cotuong-deploy-activate >/dev/null
          if systemctl is-active --quiet cotuong-test.service; then
            echo 'cotuong-test.service is already active; expected stopped after bootstrap.' >&2
            exit 1
          fi
          if systemctl is-active --quiet nginx.service; then
            echo 'Nginx is active; refusing the test deployment preflight.' >&2
            exit 1
          fi
          if [[ -e /srv/cotuong/deploy/pending || -L /srv/cotuong/deploy/pending ]]; then
            echo 'A pending release pointer already exists; inspect it before continuing.' >&2
            exit 1
          fi
          if [[ -L /srv/cotuong/current ]]; then
            current="$(realpath -e /srv/cotuong/current)"
            [[ "$current" == /srv/cotuong/releases/* && -d "$current" ]]
          elif [[ -e /srv/cotuong/current ]]; then
            echo 'The current path exists but is not a symlink.' >&2
            exit 1
          fi
          printf 'Read-only VPS preflight PASS: deploy identity, permissions, unit, sudo gate, Nginx, and release pointers. No files or services were changed.\n'
          REMOTE
