name: VPS test read-only preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  validate-environment-gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the reviewed vps-test gate before referencing the Environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/vps-test")"
          jq -e '
            .can_admins_bypass == false and
            .deployment_branch_policy.custom_branch_policies == true and
            .deployment_branch_policy.protected_branches == false and
            any(.protection_rules[]?; .type == "required_reviewers" and
              any(.reviewers[]?; .reviewer.login == "hoangbbcg-cell"))
          ' <<< "$environment_json" >/dev/null || {
            echo 'vps-test must require hoangbbcg-cell, restrict to custom branches, and disallow admin bypass.' >&2
            exit 1
          }
          branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/vps-test/deployment-branch-policies")"
          jq -e '[.branch_policies[].name] == ["master"]' <<< "$branch_json" >/dev/null || {
            echo 'vps-test must allow only the master branch.' >&2
            exit 1
          }

  preflight:
    if: github.ref == 'refs/heads/master'
    needs: validate-environment-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vps-test
    steps:
      - name: Check deploy contract without changing the VPS
        env:
          VPS_TEST_SSH_KEY: ${{ secrets.VPS_TEST_SSH_KEY }}
          VPS_TEST_KNOWN_HOSTS: ${{ secrets.VPS_TEST_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_TEST_SSH_KEY" && -n "$VPS_TEST_KNOWN_HOSTS" ]] || {
            echo 'Configure VPS_TEST_SSH_KEY and VPS_TEST_KNOWN_HOSTS in the vps-test Environment.' >&2
            exit 1
          }
          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/cotuong-vps-test-preflight.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_TEST_SSH_KEY" > "$ssh_dir/cotuong_deploy"
          printf '%s\n' "$VPS_TEST_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/cotuong_deploy" "$ssh_dir/known_hosts"
          if ! ssh-keygen -y -f "$ssh_dir/cotuong_deploy" >/dev/null 2>&1; then
            echo 'VPS_TEST_SSH_KEY is not a readable OpenSSH private key.' >&2
            exit 1
          fi
          ssh-keygen -F 103.153.254.184 -f "$ssh_dir/known_hosts" >/dev/null || {
            echo 'Known-hosts secret does not contain the pinned new VPS host.' >&2
            exit 1
          }
          ssh-keygen -F 103.153.254.184 -f "$ssh_dir/known_hosts" | ssh-keygen -lf - |
            grep -F 'SHA256:CJzV7hFpB6mDfGDoBm/ViJvw5D5HlBhR60gmOJGLW74' |
            grep -F '(ED25519)' >/dev/null || {
              echo 'Known-hosts secret does not match the pinned ED25519 fingerprint.' >&2
              exit 1
            }

          ssh_opts=(
            -i "$ssh_dir/cotuong_deploy"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
          )
          if ssh "${ssh_opts[@]}" cotuong_deploy@103.153.254.184 'bash -s' <<'REMOTE'
          set -euo pipefail
          remote_fail() { printf 'Read-only VPS preflight failed: %s\n' "$1" >&2; exit 1; }
          [[ "$(id -un)" == cotuong_deploy && "$HOME" == /home/cotuong_deploy ]] || remote_fail 'SSH identity or home directory is unexpected.'
          ip -o -4 addr show scope global | awk '{sub(/\/.*/, "", $4); print $4}' | grep -Fxq 103.153.254.184 || remote_fail 'VPS does not report the pinned public IPv4 address.'
          [[ -d /srv/cotuong && ! -L /srv/cotuong ]] || remote_fail '/srv/cotuong is missing or is a symlink.'
          [[ "$(stat -c %U:%G:%a /srv/cotuong)" == root:root:755 ]] || remote_fail '/srv/cotuong must be root:root mode 755.'
          [[ -d /srv/cotuong/releases && ! -L /srv/cotuong/releases ]] || remote_fail '/srv/cotuong/releases is missing or is a symlink.'
          [[ "$(stat -c %U:%G:%a /srv/cotuong/releases)" == cotuong_deploy:cotuong_release:2750 ]] || remote_fail '/srv/cotuong/releases has unexpected owner, group, or mode.'
          [[ -d /srv/cotuong/deploy && ! -L /srv/cotuong/deploy ]] || remote_fail '/srv/cotuong/deploy is missing or is a symlink.'
          [[ "$(stat -c %U:%G:%a /srv/cotuong/deploy)" == cotuong_deploy:cotuong_deploy:700 ]] || remote_fail '/srv/cotuong/deploy has unexpected owner, group, or mode.'
          [[ -d /home/cotuong_deploy/.cotuong-incoming && ! -L /home/cotuong_deploy/.cotuong-incoming ]] || remote_fail 'Deploy incoming directory is missing or is a symlink.'
          [[ "$(stat -c %U:%G:%a /home/cotuong_deploy/.cotuong-incoming)" == cotuong_deploy:cotuong_deploy:700 ]] || remote_fail 'Deploy incoming directory has unexpected owner, group, or mode.'
          if [[ -r /etc/cotuong/cotuong.env ]]; then
            remote_fail 'Deployment identity can read the protected environment file.'
          fi
          systemctl is-enabled --quiet cotuong-test.service || remote_fail 'cotuong-test.service is not enabled.'
          unit="$(systemctl cat cotuong-test.service)" || remote_fail 'systemctl cannot read cotuong-test.service.'
          grep -Fxq 'User=cotuong' <<< "$unit" || remote_fail 'Unit User must be cotuong.'
          grep -Fxq 'Group=cotuong' <<< "$unit" || remote_fail 'Unit Group must be cotuong.'
          grep -Fxq 'WorkingDirectory=/srv/cotuong/current' <<< "$unit" || remote_fail 'Unit WorkingDirectory is unexpected.'
          grep -Fxq 'EnvironmentFile=/etc/cotuong/cotuong.env' <<< "$unit" || remote_fail 'Unit EnvironmentFile path is unexpected.'
          grep -Fxq 'Environment=HOST=127.0.0.1' <<< "$unit" || remote_fail 'Unit HOST must bind loopback.'
          grep -Fxq 'Environment=PORT=3001' <<< "$unit" || remote_fail 'Unit PORT is unexpected.'
          grep -Fxq 'Environment=NODE_ENV=production' <<< "$unit" || remote_fail 'Unit NODE_ENV is unexpected.'
          grep -Fxq 'ExecStart=/opt/node-v22.23.3/bin/node --import tsx server/index.ts' <<< "$unit" || remote_fail 'Unit ExecStart is unexpected.'
          grep -Fxq 'ProtectHome=true' <<< "$unit" || remote_fail 'Unit ProtectHome hardening is missing.'
          grep -Fxq 'ProtectSystem=strict' <<< "$unit" || remote_fail 'Unit ProtectSystem hardening is missing.'
          grep -Fxq 'ReadWritePaths=/srv/cotuong/shared' <<< "$unit" || remote_fail 'Unit writable path is unexpected.'
          id -nG | tr ' ' '\n' | grep -Fxq cotuong_release || remote_fail 'Deploy user is not in cotuong_release.'
          id -nG cotuong | tr ' ' '\n' | grep -Fxq cotuong_release || remote_fail 'Runtime user is not in cotuong_release.'
          [[ -f /usr/local/sbin/cotuong-deploy-activate && ! -L /usr/local/sbin/cotuong-deploy-activate ]] || remote_fail 'Activation helper is missing or is a symlink.'
          [[ "$(stat -c %U:%G:%a /usr/local/sbin/cotuong-deploy-activate)" == root:root:750 ]] || remote_fail 'Activation helper must be root:root mode 750.'
          # The helper is intentionally root:root 0750, so cotuong_deploy must not
          # execute it directly. The next check verifies the exact NOPASSWD sudo rule;
          # deployment invokes that fixed helper through sudo only.
          sudo -n -l /usr/local/sbin/cotuong-deploy-activate >/dev/null || remote_fail 'Restricted sudo allowance for the activation helper is missing.'
          if systemctl is-active --quiet cotuong-test.service; then
            remote_fail 'cotuong-test.service is active; expected stopped after bootstrap.'
          fi
          if systemctl is-active --quiet nginx.service; then
            remote_fail 'Nginx is active; expected inactive for test preflight.'
          fi
          if [[ -e /srv/cotuong/deploy/pending || -L /srv/cotuong/deploy/pending ]]; then
            remote_fail 'A pending release pointer already exists.'
          fi
          if [[ -L /srv/cotuong/current ]]; then
            current="$(realpath -e /srv/cotuong/current)"
            [[ "$current" == /srv/cotuong/releases/* && -d "$current" ]] || remote_fail 'Current symlink does not resolve to a release directory.'
          elif [[ -e /srv/cotuong/current ]]; then
            remote_fail 'Current exists but is not a symlink.'
          fi
          printf 'Read-only VPS preflight PASS: deploy identity, permissions, unit, sudo gate, Nginx, and release pointers. No files or services were changed.\n'
          REMOTE
          then
            :
          else
            ssh_status=$?
            printf 'SSH/read-only VPS preflight failed with exit code %s; see the preceding SSH or named remote-check diagnostic.\n' "$ssh_status" >&2
            exit "$ssh_status"
          fi
