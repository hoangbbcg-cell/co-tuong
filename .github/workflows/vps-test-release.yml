name: Build VPS test release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on master to package
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify-reviewer-gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the reviewed vps-test Environment before package approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/vps-test")"
          jq -e '
            .can_admins_bypass == false and
            .deployment_branch_policy.custom_branch_policies == true and
            .deployment_branch_policy.protected_branches == false and
            any(.protection_rules[]?; .type == "required_reviewers" and
              any(.reviewers[]?; .reviewer.login == "hoangbbcg-cell"))
          ' <<< "$environment_json" >/dev/null || {
            echo 'vps-test must require hoangbbcg-cell, restrict to custom branches, and disallow admin bypass.' >&2
            exit 1
          }
          branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/vps-test/deployment-branch-policies")"
          jq -e '[.branch_policies[].name] == ["master"]' <<< "$branch_json" >/dev/null || {
            echo 'vps-test must allow only the master branch.' >&2
            exit 1
          }

  package:
    if: github.ref == 'refs/heads/master'
    needs: verify-reviewer-gate
    environment:
      name: vps-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and select requested master commit
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/master
          git cat-file -e "${RELEASE_SHA}:board-game/ops/vps-new/build-test-release.sh"
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push&per_page=100")"
          jq -e --arg sha "$RELEASE_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "master" and
              .name == "CI" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | length > 0
          ' <<< "$runs_json" >/dev/null
          git checkout --detach "$RELEASE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: board-game/package-lock.json

      - name: Build locked test release
        working-directory: board-game
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: ./ops/vps-new/build-test-release.sh "$RELEASE_SHA"

      - name: Create archive checksum
        working-directory: board-game
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: sha256sum "$RELEASE_SHA.tar.gz" > "$RELEASE_SHA.tar.gz.sha256"

      - name: Upload immutable release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cotuong-vps-test-${{ inputs.sha }}
          path: |
            board-game/${{ inputs.sha }}.tar.gz
            board-game/${{ inputs.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
