# Include inside the same Nginx server block that already serves /jieqi-ai
# with COOP/COEP isolation. This is an INTERNAL rewrite; the browser keeps
# /co-up-ong-hoang. Preserve the existing /jieqi-ai location and its headers.
location = /co-up-ong-hoang {
    rewrite ^ /jieqi-ai last;
}
location = /co-up-ong-hoang/ {
    rewrite ^ /jieqi-ai last;
}
